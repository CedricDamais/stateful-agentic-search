[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-policy"
version = "0.1.0"
description = "Experiment 0: constrained action policies for agentic search"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qwen = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
agentic-policy-demo = "agentic_policy.experiments.demo:main"
agentic-policy-benchmark = "agentic_policy.experiments.benchmark:main"
agentic-policy-speed = "agentic_policy.experiments.speed_comparison:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
